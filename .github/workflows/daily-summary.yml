name: Daily AI News Digest

# Runs Horizon (the AI news radar) inside this repo every morning,
# turns the newest Chinese digest into a blog post, and publishes it.
# The standalone ai-news-radar repo is no longer needed once this works.
on:
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:

# Only one run at a time. The 07:40 check triggers a manual run when the
# scheduled run is missing, and two check jobs once fired together: both
# runs generated the same post and raced on `git push`, so the second one
# failed with "failed to push some refs". With this group, a duplicate
# trigger waits for the running one to finish instead of racing it; the
# waiting run then finds no diff and exits cleanly.
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - name: Install dependencies
        working-directory: radar
        run: uv sync
      - name: Prepare Horizon config
        working-directory: radar
        run: cp data/config.github.json data/config.json
      - name: Run Horizon
        working-directory: radar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24
      - name: Convert digest to blog post
        run: bash radar/convert-to-blog.sh
      - name: Add arXiv papers
        # Appends a "## AI 论文" section (3-5 papers from the last 7 days,
        # ranked by Groq for the user's interests, deduped against recent
        # posts) to today's post. Never fails the run: it exits 0 when there
        # is no post yet, no fresh paper, or the section is already present.
        working-directory: radar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 papers.py
      - name: Add Product Hunt products
        # Appends a "## Product Hunt 新品" section (3-5 products launched in
        # the last 24h, ranked by Groq, deduped against recent posts) as the
        # third section, after AI papers. Same never-fails-the-run contract.
        working-directory: radar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 products.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ssh-adventurer123"
          git config user.email "ssh-adventurer123@users.noreply.com"
          git add content/posts/daily-*.md
          if git diff --cached --quiet; then
            echo "No new post, nothing to commit."
            exit 0
          fi
          git commit -m "daily ai news: $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          # Rebase onto the latest main before pushing: if anything else
          # landed meanwhile (another run, or the user editing the blog),
          # this replays our post commit on top instead of failing with
          # "failed to push some refs". If the remote already has the
          # identical post, our commit becomes empty and is dropped.
          git pull --rebase origin main
          git push origin main
          # A push made with GITHUB_TOKEN does not trigger other workflows,
          # so start the Hugo deploy explicitly.
          gh workflow run hugo.yaml --ref main
