# 个人博客配置 —— 照着 hobbytp 那种 Hugo + GitHub Pages 结构做的简化版
# 改名字只改下面 title / params.author 这一处就行
baseURL: "https://ssh-adventurer123.github.io/"
languageCode: zh-cn
defaultContentLanguage: zh-cn
title: "Wang 的 AI 博客"
theme: PaperMod

# 生成 sitemap / RSS（搜索栏目已去掉，不再需要 JSON 索引）
outputs:
  home: [HTML, RSS]

# 分类和标签：文章 front matter 里写 categories: ["my-insights"] 就会自动归到对应栏目
taxonomies:
  category: categories
  tag: tags

params:
  author: "Wang"
  description: "记录 AI 学习、拆解和分享。先搭好站，再慢慢填栏目。"
  defaultTheme: dark
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  # 首页大字介绍
  homeInfoParams:
    Title: "Wang 的 AI 博客"
    Content: "每天学一点 AI，记录、拆解、分享。栏目后面再细填，先把站跑起来。"
  socialIcons:
    - name: github
      url: "https://github.com/ssh-adventurer123"

# 顶部菜单：顺序照着 hobbytp 左边栏来的
# 每日AI动态是外链，指向你已有的新闻雷达站，原站不动、定时不动
menu:
  main:
    - name: 首页
      url: /
      weight: 1
    - name: 关于我
      url: /about/
      weight: 2
    - name: 个人洞察
      url: /categories/my-insights/
      weight: 10
    - name: 名人洞察
      url: /categories/celebrity-insights/
      weight: 11
    - name: 智能体与编程
      url: /categories/ai-programming/
      weight: 12
    - name: 模型与研究
      url: /categories/large-models/
      weight: 13
    - name: 开源项目
      url: /categories/projects/
      weight: 15
    - name: 每日AI动态
      url: https://ssh-adventurer123.github.io/ai-news-radar/
      weight: 17
    - name: 我的开源
      url: https://github.com/ssh-adventurer123?tab=repositories
      weight: 18
